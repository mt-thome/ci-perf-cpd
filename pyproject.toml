[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-perf-cpd"
version = "0.1.0"
description = "Detecção de Regressões de Desempenho em Pipelines de Integração Contínua via Mineração de Séries Temporais"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matheus", email = "researcher@unesp.br" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.13.0,<1.18.0",
    "pandas>=2.2.0,<3.1.0",
    "matplotlib>=3.8.0,<3.12.0",
    "seaborn>=0.13.0,<0.14.0",
    "ruptures>=1.1.8,<1.2.0",
    "pyyaml>=6.0.0,<7.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "pytest>=8.0.0,<10.0.0",
    "ipykernel>=6.29.0,<7.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

